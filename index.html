<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دوري ميدي للمحترفين 2026</title>

    <!-- خط Cairo -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- التصميم -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- رأس الموقع -->
    <header class="header">
        <div class="head">

            <div class="brand">
                <img
                    class="league-logo"
                    src="https://i.postimg.cc/xC7qTMXK/IMG-20260829-232623.png"
                    alt="شعار دوري ميدي"
                >

                <div>
                    <div class="title">
                        دوري ميدي للمحترفين
                    </div>

                    <div class="sub">
                        ملعب بني فايد 2026
                    </div>
                </div>
            </div>

            <div class="actions">
                <button
                    class="icon"
                    id="themeButton"
                    type="button"
                >
                    ☀️/🌙
                </button>
            </div>

        </div>
    </header>


    <!-- المحتوى الرئيسي -->
    <main class="container">

        <div id="public">

            <!-- المباراة القادمة -->
            <div class="count">
                <div class="small">
                    ⏳ المباراة القادمة
                </div>

                <div
                    class="timer"
                    id="timer"
                >
                    —
                </div>
            </div>


            <!-- المباريات -->
            <section id="sec-matches">

                <div class="section-title">
                    <span>📅 المباريات</span>
                </div>

                <div id="matches"></div>

            </section>


            <!-- جدول الترتيب -->
            <section
                id="sec-standings"
                class="hidden"
            >

                <div class="card">

                    <div class="section-title">
                        🏆 جدول الترتيب
                    </div>

                    <div style="overflow:auto">

                        <table>

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>الفريق</th>
                                    <th>ل</th>
                                    <th>ف</th>
                                    <th>ت</th>
                                    <th>خ</th>
                                    <th>له</th>
                                    <th>عليه</th>
                                    <th>+/-</th>
                                    <th>نقاط</th>
                                </tr>
                            </thead>

                            <tbody id="standings"></tbody>

                        </table>

                    </div>

                </div>

            </section>


            <!-- الأخبار -->
            <section
                id="sec-news"
                class="hidden"
            >

                <div class="section-title">
                    📰 الأخبار والوسائط
                </div>

                <div id="news"></div>

            </section>


            <!-- الفرق واللاعبون -->
            <section
                id="sec-teams"
                class="hidden"
            >

                <div
                    class="team-nav"
                    id="teamNav"
                ></div>

                <div
                    class="card"
                    style="margin-top:10px"
                >

                    <div class="section-title">
                        <span id="teamTitle"></span>
                    </div>

                    <input
                        class="input search"
                        id="playerSearch"
                        type="search"
                        placeholder="🔎 ابحث عن لاعب بالاسم..."
                    >

                    <div
                        class="players"
                        id="players"
                    ></div>

                </div>

            </section>


            <!-- الهدافون والبطاقات -->
            <section
                id="sec-scorers"
                class="hidden"
            >

                <div class="card">

                    <div class="section-title">
                        ⚽ الهدافون
                    </div>

                    <div id="scorers"></div>

                </div>


                <div class="card">

                    <div class="section-title">
                        🟨🟥 البطاقات
                    </div>

                    <div id="cards"></div>

                </div>

            </section>


            <!-- الإدارة -->
            <section
                id="sec-admin"
                class="hidden"
            >

                <div
                    id="adminLogin"
                    class="card"
                >

                    <div class="section-title">
                        🔐 دخول الإدارة
                    </div>

                    <div class="notice">
                        صفحة الإدارة مستقلة ولا يوجد رابط لها في الواجهة العامة.
                    </div>

                    <div class="form">

                        <input
                            class="input"
                            id="email"
                            type="email"
                            placeholder="البريد الإلكتروني للإدارة"
                        >

                        <input
                            class="input"
                            id="password"
                            type="password"
                            placeholder="كلمة المرور"
                        >

                        <button
                            class="btn primary"
                            id="loginButton"
                            type="button"
                        >
                            تسجيل الدخول
                        </button>

                    </div>

                </div>


                <div
                    id="adminPanel"
                    class="hidden"
                ></div>

            </section>

        </div>

    </main>


    <!-- القائمة السفلية -->
    <nav class="nav">

        <button
            class="active"
            id="nav-matches"
            data-tab="matches"
            type="button"
        >
            <span>📅</span>
            المباريات
        </button>


        <button
            id="nav-standings"
            data-tab="standings"
            type="button"
        >
            <span>🏆</span>
            الترتيب
        </button>


        <button
            id="nav-news"
            data-tab="news"
            type="button"
        >
            <span>📰</span>
            الأخبار
        </button>


        <button
            id="nav-teams"
            data-tab="teams"
            type="button"
        >
            <span>🛡️</span>
            الفرق
        </button>


        <button
            id="nav-scorers"
            data-tab="scorers"
            type="button"
        >
            <span>⚽</span>
            الهدافين
        </button>

    </nav>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ملفات المشروع -->
    <script src="js/supabase.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
