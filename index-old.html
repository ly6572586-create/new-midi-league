// روابط صور اللاعبين: تُحفظ في Supabase داخل playerImages، ولا نحتاج رفع الملفات.
data.playerImages=data.playerImages||{};
function team(n){return data.teams.find(t=>t.name===n)||{} } function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const r=await db.from('league_data').select('data').eq('id',1).single();if(!r.error&&r.data?.data){data=r.data.data}else{console.warn('Supabase load:',r.error)};renderAll();countdown()}

function renderMatches(){let b=document.getElementById('matches');b.innerHTML=data.matches.length?data.matches.map(m=>{let a=team(m.team1),c=team(m.team2);let ev=(m.scorers||[]).map(s=>'⚽ '+esc(s.name)+' ('+s.goals+')'+(s.minute?' — '+esc(s.minute)+"'":'')).concat((m.cards||[]).map(c=>(c.type==='yellow'?'🟨':'🟥')+' '+esc(c.name)+(c.minute?' — '+esc(c.minute)+"'":'')));return `<div class="match"><div class="match-head"><span>⏰ ${esc(m.date)} • ${esc(m.time||'')}</span><span class="badge">${esc(m.stage||'')}</span></div><div class="match-body"><div class="team"><img src="${a.logo||''}">${esc(m.team1)}</div><div>${m.status==='finished'?`<div class="score">${m.score1} - ${m.score2}</div>`:'<div class="vs">VS</div>'}</div><div class="team"><img src="${c.logo||''}">${esc(m.team2)}</div></div>${m.details?`<div class="events"><b>📝 تفاصيل المباراة:</b><br>${esc(m.details)}</div>`:''}${ev.length?`<div class="events"><b>أحداث المباراة:</b><br>${ev.join(' • ')}</div>`:''}</div>`}).join(''):'<div class="empty">لا توجد مباريات</div>'}

function renderScorers(){let goals={},cards=[];data.matches.filter(m=>m.status==='finished').forEach(m=>{(m.scorers||[]).forEach(s=>goals[s.name]=(goals[s.name]||0)+(+s.goals||0));(m.cards||[]).forEach(c=>cards.push(c))});let gs=Object.entries(goals).sort((a,b)=>b[1]-a[1]);document.getElementById('scorers').innerHTML=gs.length?gs.map((x,i)=>`<div class="list-item"><b>${i+1}. ${esc(x[0])}</b><b style="color:var(--gold)">⚽ ${x[1]}</b></div>`).join(''):'<div class="empty">لا توجد أهداف مسجلة</div>';document.getElementById('cards').innerHTML=cards.length?cards.map(c=>`<div class="list-item"><b>${c.type==='yellow'?'🟨':'🟥'} ${esc(c.name)}</b><span>${c.type==='yellow'?'صفراء':'حمراء'}</span></div>`).join(''):'<div class="empty">لا توجد بطاقات مسجلة</div>'}
function countdown(){setInterval(()=>{let up=data.matches.filter(m=>m.status!=='finished').sort((a,b)=>new Date(a.date+' '+a.time)-new Date(b.date+' '+b.time))[0];if(!up){document.getElementById('timer').textContent='لا توجد مباراة قادمة';return}let target=parseDate(up);let d=target-Date.now();if(d<=0)document.getElementById('timer').textContent='⚽ المباراة قيد الانطلاق';else{let h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);document.getElementById('timer').textContent=`${h} ساعة : ${m} دقيقة : ${s} ثانية`}},1000)}
function parseDate(m){let nums=m.date.match(/(\d{1,2}).*?(يناير|فبراير|مارس|أبريل|مايو|يونيو|يوليو|أغسطس|سبتمبر|أكتوبر|نوفمبر|ديسمبر).*?(\d{4})/);let months={يناير:0,فبراير:1,مارس:2,'أبريل':3,مايو:4,يونيو:5,يوليو:6,أغسطس:7,سبتمبر:8,أكتوبر:9,نوفمبر:10,ديسمبر:11};if(!nums)return Date.now();let tm=(m.time||'16:30').match(/(\d{1,2}):(\d{2})/);let h=tm?+tm[1]:16;if((m.time||'').includes('مساء')&&h<12)h+=12;return new Date(+nums[3],months[nums[2]],+nums[1],h,tm?+tm[2]:30).getTime()}
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return alert('أدخل البريد وكلمة المرور');let r=await db.auth.signInWithPassword({email,password});if(r.error)return alert('فشل تسجيل الدخول: '+r.error.message);adminUser=r.data.user;showAdmin()}
async function logout(){await db.auth.signOut();adminUser=null;showAdminRoute()}
async function showAdminRoute(){let r=await db.auth.getUser();adminUser=r.data.user||null;if(adminUser)showAdmin();else{document.getElementById('adminLogin').classList.remove('hidden');document.getElementById('adminPanel').classList.add('hidden')}}
function showAdmin(){document.getElementById('adminLogin').classList.add('hidden');let p=document.getElementById('adminPanel');p.classList.remove('hidden');adminView('matches')}
function adminView(view){let p=document.getElementById('adminPanel');p.innerHTML=`<div class="card"><div class="section-title"><span>⚙️ لوحة الإدارة</span><button class="btn danger" onclick="logout()">خروج</button></div><div class="admin-tabs"><button class="btn secondary" onclick="adminView('matches')">المباريات</button><button class="btn secondary" onclick="adminView('teams')">الفرق واللاعبون</button><button class="btn secondary" onclick="adminView('news')">الأخبار</button></div><div id="adminArea"></div></div>`;if(view==='matches')adminMatches();if(view==='teams')adminTeams();if(view==='news')adminNews()}
function adminMatches(){let a=document.getElementById('adminArea');a.innerHTML=`<div class="notice">يمكنك إضافة عدد غير محدود من المباريات، وتحديد ذهاب/إياب وتاريخ ووقت خاصين بك. لا يوجد حد ثابت للموسم.</div><button class="btn primary" onclick="matchForm()">➕ إضافة مباراة</button><div style="margin-top:10px">${data.matches.map(m=>`<div class="list-item"><div><b>${esc(m.team1)} × ${esc(m.team2)}</b><div class="small">${esc(m.date)} • ${esc(m.stage||'')}</div></div><div class="actions2"><button class="secondary" onclick="matchForm(${m.id})">✏️ تعديل</button><button class="danger" onclick="deleteMatch(${m.id})">🗑️</button></div></div>`).join('')}</div>`}
function matchForm(id){let m=id?data.matches.find(x=>x.id===id):{id:null,team1:data.teams[0]?.name||'',team2:data.teams[1]?.name||'',date:'',time:'04:30 مساءً',stage:'الذهاب - جولة جديدة',score1:0,score2:0,status:'upcoming',scorers:[],cards:[]};let a=document.getElementById('adminArea');a.innerHTML=`<div class="card"><div class="section-title">${id?'✏️ تعديل مباراة':'➕ مباراة جديدة'}</div><div class="form"><div class="row"><select class="select" id="m_t1">${data.teams.map(t=>`<option ${t.name===m.team1?'selected':''}>${esc(t.name)}</option>`).join('')}</select><select class="select" id="m_t2">${data.teams.map(t=>`<option ${t.name===m.team2?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><input class="input" id="m_date" placeholder="مثال: 10 سبتمبر 2026" value="${esc(m.date)}"><input class="input" id="m_time" placeholder="مثال: 04:30 مساءً" value="${esc(m.time||'04:30 مساءً')}"><input class="input" id="m_stage" placeholder="مثال: الإياب - الجولة 1" value="${esc(m.stage||'')}"><textarea class="textarea" id="m_details" placeholder="تفاصيل المباراة">${esc(m.details||'')}</textarea><div class="row"><input class="input" id="m_s1" type="number" min="0" value="${m.score1||0}"><input class="input" id="m_s2" type="number" min="0" value="${m.score2||0}"></div><select class="select" id="m_status"><option value="upcoming" ${m.status==='upcoming'?'selected':''}>لم تبدأ</option><option value="finished" ${m.status==='finished'?'selected':''}>انتهت</option></select><button class="btn primary" onclick="saveMatch(${id||0})">💾 حفظ المباراة</button><button class="btn secondary" onclick="adminMatches()">رجوع</button></div></div><div class="card"><div class="section-title">⚽ أهداف وبطاقات المباراة</div><div class="form"><select class="select" id="eventPlayer">${allPlayers().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select><div class="row"><input class="input" id="eventGoals" type="number" min="1" value="1"><input class="input" id="goalMinute" placeholder="دقيقة الهدف (اختياري)"><button class="btn primary" onclick="addGoal(${id||0})">إضافة هدف</button></div><div id="goalList"></div><div class="row"><select class="select" id="cardType"><option value="yellow">🟨 صفراء</option><option value="red">🟥 حمراء</option></select><input class="input" id="cardMinute" placeholder="دقيقة البطاقة (اختياري)"><button class="btn danger" onclick="addCard(${id||0})">إضافة بطاقة</button></div><div id="cardList"></div></div></div>`;window.editMatch=m;renderEventLists()}
function allPlayers(){let a=[];Object.values(data.players).forEach(x=>a=a.concat(x));return [...new Set(a)]}function renderEventLists(){let m=window.editMatch;if(!m)return;document.getElementById('goalList').innerHTML=(m.scorers||[]).map((s,i)=>`<div class="list-item">⚽ ${esc(s.name)} (${s.goals})${s.minute?` — ${esc(s.minute)}'`:''} <button class="danger" onclick="removeGoal(${i})">حذف</button></div>`).join('');document.getElementById('cardList').innerHTML=(m.cards||[]).map((c,i)=>`<div class="list-item">${c.type==='yellow'?'🟨':'🟥'} ${esc(c.name)}${c.minute?` — ${esc(c.minute)}'`:''} <button class="danger" onclick="removeCard(${i})">حذف</button></div>`).join('')}
function addGoal(){let n=document.getElementById('eventPlayer').value,g=+document.getElementById('eventGoals').value||1,min=document.getElementById('goalMinute').value.trim();let x=window.editMatch.scorers.find(s=>s.name===n);if(x){x.goals+=g;if(min)x.minute=min}else window.editMatch.scorers.push({name:n,goals:g,minute:min});renderEventLists()}function removeGoal(i){window.editMatch.scorers.splice(i,1);renderEventLists()}function addCard(){window.editMatch.cards.push({name:document.getElementById('eventPlayer').value,type:document.getElementById('cardType').value,minute:document.getElementById('cardMinute').value.trim()});renderEventLists()}function removeCard(i){window.editMatch.cards.splice(i,1);renderEventLists()}
async function saveMatch(id){let m=id?data.matches.find(x=>x.id===id):null;if(!m){m={id:Date.now(),scorers:[],cards:[]};data.matches.push(m)}m.team1=document.getElementById('m_t1').value;m.team2=document.getElementById('m_t2').value;m.date=document.getElementById('m_date').value.trim();m.time=document.getElementById('m_time').value.trim();m.stage=document.getElementById('m_stage').value.trim();m.details=document.getElementById('m_details').value.trim();m.score1=+document.getElementById('m_s1').value||0;m.score2=+document.getElementById('m_s2').value||0;m.status=document.getElementById('m_status').value;m.scorers=window.editMatch.scorers;m.cards=window.editMatch.cards;await persist('تم حفظ المباراة وتحديث قاعدة البيانات بنجاح');adminMatches()}
async function deleteMatch(id){if(!confirm('حذف المباراة؟'))return;data.matches=data.matches.filter(m=>m.id!==id);await persist('تم حذف المباراة وتحديث قاعدة البيانات');adminMatches()}
function adminTeams(){let a=document.getElementById('adminArea');a.innerHTML=`<button class="btn primary" onclick="teamForm()">➕ إضافة فريق</button>${data.teams.map(t=>`<div class="list-item"><div><img src="${t.logo}" style="width:32px;height:32px;object-fit:contain;vertical-align:middle"> <b>${esc(t.name)}</b> <span class="small">(${(data.players[t.id]||[]).length} لاعب)</span></div><div class="actions2"><button class="secondary" onclick="teamForm('${t.id}')">✏️</button><button class="danger" onclick="deleteTeam('${t.id}')">🗑️</button></div></div>`).join('')}<div class="card" style="margin-top:10px"><div class="section-title">👤 البحث عن لاعب وإدارته</div><input class="input search" id="adminPlayerSearch" placeholder="🔎 اسم اللاعب..." oninput="adminPlayerList()"><div id="adminPlayers"></div></div>`;adminPlayerList()}
function teamForm(id){let t=id?data.teams.find(x=>x.id===id):{id:'',name:'',logo:''};let a=document.getElementById('adminArea');a.innerHTML=`<div class="card"><div class="section-title">${id?'تعديل فريق':'إضافة فريق'}</div><div class="form"><input class="input" id="t_name" placeholder="اسم الفريق" value="${esc(t.name)}"><input class="input" id="t_logo" placeholder="رابط شعار الفريق" value="${esc(t.logo)}"><button class="btn primary" onclick="saveTeam('${id||''}')">💾 حفظ</button><button class="btn secondary" onclick="adminTeams()">رجوع</button></div></div>${id?`<div class="card"><div class="section-title">👤 لاعبو ${esc(t.name)}</div><button class="btn primary" onclick="playerForm('${id}')">➕ إضافة لاعب</button><div>${(data.players[id]||[]).map((p,i)=>`<div class="list-item"><span>${esc(p)}</span><div class="actions2"><button class="secondary" onclick="playerForm('${id}',${i})">✏️</button><button class="danger" onclick="deletePlayer('${id}',${i})">🗑️</button></div></div>`).join('')}</div></div>`:''}`}
async function saveTeam(id){let name=document.getElementById('t_name').value.trim(),logo=document.getElementById('t_logo').value.trim();if(!name)return alert('اسم الفريق مطلوب');if(id){let t=data.teams.find(x=>x.id===id),old=t.name;t.name=name;t.logo=logo;data.players[id]=data.players[id]||[];data.matches.forEach(m=>{if(m.team1===old)m.team1=name;if(m.team2===old)m.team2=name})}else{let nid='team_'+Date.now();data.teams.push({id:nid,name,logo});data.players[nid]=[]}await persist('تم حفظ الفريق في قاعدة البيانات');adminTeams()}
async function deleteTeam(id){if(data.teams.length<=1)return alert('يجب أن يبقى فريق واحد على الأقل');if(!confirm('حذف الفريق واللاعبين المرتبطين به؟'))return;data.teams=data.teams.filter(t=>t.id!==id);delete data.players[id];await persist('تم حذف الفريق');adminTeams()}
function playerForm(tid,idx){let arr=data.players[tid]||[],p=idx!=null?arr[idx]:'';let img=data.playerImages?.[p]||'';let a=document.getElementById('adminArea');a.innerHTML=`<div class="card"><div class="section-title">${idx!=null?'تعديل لاعب':'إضافة لاعب'}</div><div class="form"><input class="input" id="p_name" placeholder="اسم اللاعب" value="${esc(p)}"><input class="input" id="p_image" placeholder="رابط صورة اللاعب (اختياري)" value="${esc(img)}"><div class="notice">حاليًا نحفظ اسم اللاعب ورابط الصورة كبيانات اللاعب. يمكن تطوير صور اللاعبين إلى حقول مستقلة لاحقًا.</div><button class="btn primary" onclick="savePlayer('${tid}',${idx!=null?idx:-1})">💾 حفظ اللاعب</button><button class="btn secondary" onclick="teamForm('${tid}')">رجوع</button></div></div>`}
async function savePlayer(tid,idx){let n=document.getElementById('p_name').value.trim();if(!n)return alert('اسم اللاعب مطلوب');let old=idx>=0?data.players[tid][idx]:null;if(idx>=0)data.players[tid][idx]=n;else data.players[tid].push(n);data.playerImages=data.playerImages||{};let img=document.getElementById('p_image').value.trim();if(old&&old!==n&&data.playerImages[old]){data.playerImages[n]=data.playerImages[old];delete data.playerImages[old]}if(img)data.playerImages[n]=img;else delete data.playerImages[n];await persist('تم حفظ اللاعب ورابط صورته في قاعدة البيانات');teamForm(tid)}
async function deletePlayer(tid,i){if(!confirm('حذف اللاعب؟'))return;let old=data.players[tid][i];data.players[tid].splice(i,1);if(data.playerImages)delete data.playerImages[old];await persist('تم حذف اللاعب');teamForm(tid)}
function adminPlayerList(){let b=document.getElementById('adminPlayers');if(!b)return;let q=(document.getElementById('adminPlayerSearch')?.value||'').toLowerCase();let out=[];data.teams.forEach(t=>(data.players[t.id]||[]).forEach((p,i)=>{if(p.toLowerCase().includes(q))out.push({t,p,i})}));b.innerHTML=out.length?out.map(x=>`<div class="list-item"><span>${esc(x.p)} <span class="small">— ${esc(x.t.name)}</span></span><button class="secondary" onclick="playerForm('${x.t.id}',${x.i})">✏️ تعديل</button></div>`).join(''):'<div class="empty">لا يوجد لاعب مطابق</div>'}
function adminNews(){let a=document.getElementById('adminArea');a.innerHTML=`<button class="btn primary" onclick="newsForm()">➕ إضافة خبر</button>${(data.news||[]).map(n=>`<div class="list-item"><span><b>${esc(n.title)}</b><div class="small">${esc(n.date||'')} • ${esc(n.mediaType||'text')}</div></span><div class="actions2"><button class="secondary" onclick="newsForm(${n.id})">✏️</button><button class="danger" onclick="deleteNews(${n.id})">🗑️</button></div></div>`).join('')}`}
function newsForm(id){let n=id?data.news.find(x=>x.id===id):{title:'',content:'',videoUrl:'',mediaType:'text',date:new Date().toISOString().slice(0,10)};document.getElementById('adminArea').innerHTML=`<div class="card"><div class="section-title">${id?'✏️ تعديل خبر':'➕ إضافة خبر'}</div><div class="form"><input class="input" id="n_title" placeholder="عنوان الخبر" value="${esc(n.title)}"><textarea class="textarea" id="n_content" placeholder="محتوى الخبر">${esc(n.content)}</textarea><select class="select" id="n_type"><option value="text" ${n.mediaType==='text'?'selected':''}>نص فقط</option><option value="image" ${n.mediaType==='image'?'selected':''}>صورة</option><option value="youtube" ${n.mediaType==='youtube'?'selected':''}>YouTube</option><option value="video" ${n.mediaType==='video'?'selected':''}>فيديو مباشر</option><option value="link" ${n.mediaType==='link'?'selected':''}>رابط TikTok أو منصة أخرى</option></select><input class="input" id="n_url" placeholder="رابط الصورة/الفيديو/المنصة" value="${esc(n.videoUrl||'')}"><input class="input" id="n_date" type="date" value="${esc(n.date||'')}"><button class="btn primary" onclick="saveNews(${id||0})">💾 حفظ ونشر</button><button class="btn secondary" onclick="adminNews()">رجوع</button></div></div>`}
async function saveNews(id){let n=id?data.news.find(x=>x.id===id):null;if(!n){n={id:Date.now()};data.news.unshift(n)}n.title=document.getElementById('n_title').value.trim();n.content=document.getElementById('n_content').value.trim();n.mediaType=document.getElementById('n_type').value;n.videoUrl=document.getElementById('n_url').value.trim();n.date=document.getElementById('n_date').value;await persist('تم حفظ الخبر وتحديث قاعدة البيانات');adminNews()}
async function deleteNews(id){if(!confirm('حذف الخبر؟'))return;data.news=data.news.filter(n=>n.id!==id);await persist('تم حذف الخبر');adminNews()}
async function persist(msg){try{await save();renderAll();alert('✓ '+msg)}catch(e){console.error(e);alert('❌ لم يتم الحفظ في قاعدة البيانات. لم نعتبر العملية ناجحة.\n\n'+(e.message||e))}}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')}
function route(){let isAdmin=location.pathname.replace(/\/$/,'')==='/admin';if(isAdmin){document.getElementById('public').querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById('sec-admin').classList.remove('hidden');showAdminRoute()}}
window.addEventListener('load',()=>{if(localStorage.getItem('theme')==='light')document.body.classList.add('light');load();route()});
</script></body></html>
