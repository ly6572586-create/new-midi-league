<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الإدارة - دوري ميدي 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-login-logo">
                <img
                    src="https://i.postimg.cc/xC7qTMXK/IMG-20260829-232623.png"
                    alt="دوري ميدي">
            </div>

            <span class="admin-login-label">
                ADMIN PANEL
            </span>

            <h1>
                تسجيل دخول الإدارة
            </h1>

            <p>
                أدخل بيانات حساب الإدارة للمتابعة
            </p>

            <form id="adminLoginForm">

                <div class="admin-field">

                    <label for="adminEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        required>

                </div>


                <div class="admin-field">

                    <label for="adminPassword">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="كلمة المرور"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                    id="adminLoginButton">

                    دخول الإدارة

                </button>

            </form>


            <div
                id="adminLoginMessage"
                class="admin-login-message">
            </div>


            <a href="index.html" class="admin-back-link">
                ← العودة إلى الموقع
            </a>

        </div>

    </main>


    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- إعداد Supabase -->
    <script src="js/supabase.js"></script>

    <!-- منطق تسجيل الدخول -->
    <script src="js/admin.js"></script>

</body>

</html>
